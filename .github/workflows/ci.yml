name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # packages/database 使用 prisma-client generator（输出已 gitignore），需先 generate
      - run: pnpm --filter @pw/database exec prisma generate

      # Slice 0 门禁；后续切片在此基础上追加对应验收命令。
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:h5
      - run: pnpm build:weapp
