name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://pw_runtime:pw_runtime_dev_only@localhost:5432/pw_ci?schema=public
      # 平台域访问需要 owner 角色：运行时角色受租户 RLS 限制，平台域审计写入会被 42501 拒绝
      PLATFORM_DATABASE_URL: postgresql://pw:pw_ci@localhost:5432/pw_ci?schema=public
      PW_TEST_MIGRATION_URL: postgresql://pw:pw_ci@localhost:5432/pw_ci?schema=public
      PW_TEST_RUNTIME_URL: postgresql://pw_runtime:pw_runtime_dev_only@localhost:5432/pw_ci?schema=public
      SESSION_SECRET: ci-secret-0123456789-0123456789-0123456789
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # packages/database 使用 prisma-client generator（输出已 gitignore），需先 generate
      - run: pnpm --filter @pw/database exec prisma generate

      - name: Init Postgres roles & database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE ROLE pw LOGIN SUPERUSER PASSWORD 'pw_ci';"
          PGPASSWORD=postgres createdb -h localhost -U postgres -O pw pw_ci

      - name: Apply migrations
        env:
          # 迁移必须用 owner 连接：pw_runtime 角色由迁移自身创建并授权（20260906000100_tenancy），
          # 用运行时角色跑迁移会 P1000（角色尚不存在）。
          DATABASE_URL: postgresql://pw:pw_ci@localhost:5432/pw_ci?schema=public
        run: pnpm --filter @pw/database exec prisma migrate deploy

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm test:tenant-isolation
      - run: pnpm test:contract
      - run: pnpm test:coverage
      - run: pnpm test:coverage:critical
      - name: 迁移状态检查（owner 连接：_prisma_migrations 对运行时角色不可读）
        env:
          DATABASE_URL: postgresql://pw:pw_ci@localhost:5432/pw_ci?schema=public
        run: pnpm db:migrate:check
      - run: pnpm format:check
      - run: pnpm openapi:check
      - run: pnpm build
      - run: pnpm build:h5
      - run: pnpm build:weapp

      # ---------- H5 E2E（mobile-h5 project）----------
      # 为什么只跑这一个 project：它只依赖「门店 + 陪玩/老板账号与档案」这一组夹具，
      # 一个库一个 API 就够；cross-entry 需要第二个库与第二个 API 实例，另行评估。
      - name: H5 E2E 环境准备（夹具 + 浏览器）
        run: |
          npx playwright install --with-deps msedge
          DATABASE_URL=postgresql://pw:pw_ci@localhost:5432/pw_ci?schema=public \
            node work/ci-e2e-seed.mjs
          # 商家端在 E2E 里要指向 3300：API 基址是**构建期**注入的（NEXT_PUBLIC_*），
          # 默认 3000 兜底，所以这里用正确的 API 基址重构建一次，再 next start。
          NEXT_PUBLIC_API_ORIGIN=http://127.0.0.1:3300 pnpm --filter @pw/admin-web build

      - name: 启动 H5 E2E 三件套（API 3300 / 商家端 3005 / H5 3101）
        env:
          # 这三个只服务 E2E 进程；CI 的 job 级 env 仍是测试库口径。
          E2E_DATABASE_URL: postgresql://pw_runtime:pw_runtime_dev_only@localhost:5432/pw_ci?schema=public
          E2E_PLATFORM_DATABASE_URL: postgresql://pw:pw_ci@localhost:5432/pw_ci?schema=public
        run: |
          mkdir -p "$RUNNER_TEMP/evidence-ci"

          DATABASE_URL="$E2E_DATABASE_URL" \
          PLATFORM_DATABASE_URL="$E2E_PLATFORM_DATABASE_URL" \
          DATABASE_MIGRATION_URL="$E2E_PLATFORM_DATABASE_URL" \
          SESSION_SECRET="$SESSION_SECRET" \
          PAYMENT_PROVIDER=mock \
          PORT=3300 \
          EVIDENCE_ROOT="$RUNNER_TEMP/evidence-ci" \
          ADMIN_WEB_ORIGIN=http://localhost:3005 \
          H5_ORIGIN=http://localhost:3101 \
          node apps/api/dist/main.js > "$RUNNER_TEMP/api.log" 2>&1 &

          # 用 `pnpm exec next` 而不是手写 node_modules 路径：pnpm 依赖在 .pnpm store 里，
          # 仓库根没有 node_modules/next（本机在包目录下能用相对路径，CI 不行——已被 CI 抓到一次）。
          (cd apps/admin-web && pnpm exec next start -p 3005 \
            > "$RUNNER_TEMP/web.log" 2>&1 &)

          # H5 产物按同源调用 /api，所以本地必须靠这个脚本把 /api 反代到 3300。
          PHONE_H5_PORT=3101 PHONE_API_PORT=3300 \
            node work/phone-h5-server.mjs > "$RUNNER_TEMP/h5.log" 2>&1 &

          # 就绪探测：只看端口会骗人（旧进程占端口会让新进程静默失败），这里直接打接口与页面。
          # 超时余量按 CI 冷启动给足：runner 上进程启动明显慢于本机（H5 曾实测约 31s 才 listen，
          # 而当时窗口只有 30s，差 0.3s 就判失败），所以三个服务统一给 90s，并在末尾再校验一次。
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:3300/api/v1/auth/login -o /dev/null -X POST \
                -H 'content-type: application/json' \
                -d '{"kind":"tenant","tenantCode":"c1","username":"player","password":"zcloud1024"}'; then
              echo "api ready (${i}s)"; break
            fi
            sleep 1
          done
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:3005/store/login -o /dev/null; then echo "admin ready (${i}s)"; break; fi
            sleep 1
          done
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:3101/ -o /dev/null; then echo "h5 ready (${i}s)"; break; fi
            sleep 1
          done

          curl -sf http://127.0.0.1:3300/api/v1/auth/login -o /dev/null -X POST \
            -H 'content-type: application/json' \
            -d '{"kind":"tenant","tenantCode":"c1","username":"player","password":"zcloud1024"}' \
            || { echo "API 未就绪"; cat "$RUNNER_TEMP/api.log"; exit 1; }
          curl -sf http://127.0.0.1:3005/store/login -o /dev/null \
            || { echo "商家端未就绪"; cat "$RUNNER_TEMP/web.log"; exit 1; }
          curl -sf http://127.0.0.1:3101/ -o /dev/null \
            || { echo "H5 未就绪"; cat "$RUNNER_TEMP/h5.log"; exit 1; }

      - name: H5 E2E（mobile-h5）
        env:
          # E2E 用例默认找 c1；夹具脚本建的就是它。
          E2E_TENANT_CODE: c1
        run: node node_modules/@playwright/test/cli.js test --project=mobile-h5
