                        - customerProfileId
                        - customerName
                        - status
                        - scheduledStartAt
                        - remark
                        - version
                        - createdAt
                        - updatedAt
                        - requirement
                        - snapshot
                        - timeline
                      properties:
                        id:
                          type: string
                          description: 订单 id
                        tenantId:
                          type: string
                          description: 租户 id
                        orderNo:
                          type: string
                          description: 订单号
                        customerProfileId:
                          type: string
                          description: 客户档案 id
                        customerName:
                          type: string
                          description: 客户名
                        status:
                          type: string
                          description: 订单状态
                        scheduledStartAt:
                          type: string
                          format: date-time
                          nullable: true
                          description: 计划开始
                        remark:
                          type: string
                          nullable: true
                          description: 备注
                        version:
                          type: integer
                          minimum: 0
                          description: 乐观锁版本
                        createdAt:
                          type: string
                          format: date-time
                          nullable: false
                          description: 创建时间
                        updatedAt:
                          type: string
                          format: date-time
                          nullable: false
                          description: 更新时间
                        requirement:
                          type: object
                          nullable: true
                          properties:
                            description:
                              type: string
                              description: 需求描述
                            gameId:
                              type: string
                              nullable: true
                              description: 游戏 id
                            serviceProductId:
                              type: string
                              nullable: true
                              description: 服务产品 id
                            gameName:
                              type: string
                              nullable: true
                              description: 游戏名
                            productName:
                              type: string
                              nullable: true
                              description: 产品名
                            desiredStartAt:
                              type: string
                              format: date-time
                              nullable: true
                              description: 期望开始时间
                            durationSeconds:
                              type: integer
                              minimum: 1
                              description: 时长（秒）
                            minBudgetFen:
                              type: string
                              pattern: ^(?:0|[1-9][0-9]*)$
                              example: "800"
                              description: 最低预算（十进制字符串分，>=0）
                            maxBudgetFen:
                              type: string
                              pattern: ^(?:0|[1-9][0-9]*)$
                              example: "800"
                              description: 最高预算（十进制字符串分，>=0）
                            note:
                              type: string
                              nullable: true
                              description: 备注
                          required:
                            - description
                        snapshot:
                          type: array
                          items:
                            type: object
                            required:
                              - serviceProductId
                              - productName
                              - regionName
                              - durationSeconds
                              - unitPriceFen
                              - playerCostFen
                              - lineTotalFen
                              - currency
                            properties:
                              serviceProductId:
                                type: string
                                nullable: true
                                description: 服务产品 id
                              productName:
                                type: string
                                description: 产品名
                              regionName:
                                type: string
                                nullable: true
                                description: 区服名
                              durationSeconds:
                                type: integer
                                minimum: 0
                                description: 时长（秒）
                              unitPriceFen:
                                type: string
                                pattern: ^[1-9][0-9]*$
                                example: "1500"
                                description: 单价（十进制字符串分，>0）
                              playerCostFen:
                                type: string
                                pattern: ^(?:0|[1-9][0-9]*)$
                                example: "800"
                                description: 陪玩成本（十进制字符串分，>=0）
                              lineTotalFen:
                                type: string
                                pattern: ^[1-9][0-9]*$
                                example: "1500"
                                description: 行小计（十进制字符串分，>0）
                              currency:
                                type: string
                                description: 币种
                            description: 订单价格快照行
                          nullable: true
                        timeline:
                          type: array
                          items:
                            type: object
                            required:
                              - id
                              - eventType
                              - fromStatus
                              - toStatus
                              - occurredAt
                            properties:
