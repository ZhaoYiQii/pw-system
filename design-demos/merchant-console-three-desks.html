<body>
<div class="app" id="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">PW</div><div><strong>陪玩门店</strong><small>STORE CONSOLE</small></div></div>
    <div class="store"><i></i><div><b>南城 · 壹号店</b><span>营业中 · 客服席</span></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot"><span class="avatar">宁</span><div><b>宁宁</b><span>门店管理员</span></div></div>
  </aside>
  <section class="shell">
    <header class="topbar"><button class="icon-btn menu-btn" data-action="menu" aria-label="打开菜单"></button><div class="crumb">南城 · 壹号店 <b id="crumb">工作台</b></div><div class="top-actions"><label class="search-mini" id="global-search"></label><button class="icon-btn" data-action="notes" aria-label="查看设计说明" id="note-btn"></button><button class="btn primary" data-action="new-order" id="new-btn"></button></div></header>
    <main class="main" id="main"></main>
  </section>
</div>
<button class="prototype-flag" data-action="notes">UI PROTOTYPE · V3</button>

function workHTML(){const tasks=orders.filter(todo).filter(o=>workFilter==='ALL'||o.status===workFilter);return head('TODAY · 09/08','晚上好，宁宁','先处理阻塞营业的订单，再安排今晚服务。',`<div class="button-row"><button class="btn" data-action="refresh">刷新数据</button><button class="btn primary" data-action="new-order">${icons.plus}新建派单</button></div>`)+`<section class="pulse"><div class="pulse-intro"><small>今日运营脉搏</small><strong>${orders.filter(todo).length} 件待办</strong></div>${[['DRAFT','待发布'],['DISPATCHING','报名选人'],['PENDING_CONFIRMATION','待核算'],['IN_PROGRESS','服务中']].map(([s,l])=>`<button class="pulse-item" data-action="work-filter" data-status="${s}"><span>${l}</span><b>${orders.filter(o=>o.status===s).length}</b><em>查看订单</em></button>`).join('')}</section><div class="workgrid"><section class="panel"><div class="section-head"><div><h2>需要处理</h2><p>按阻塞程度与预约时间排列</p></div><span>${tasks.length} 单</span></div><div class="task-tabs">${[['ALL','全部'],['DRAFT','待发布'],['DISPATCHING','待选人'],['PENDING_CONFIRMATION','待核算']].map(([s,l])=>`<button data-action="task-filter" data-status="${s}" class="${workFilter===s?'active':''}">${l}</button>`).join('')}</div>${tasks.map((o,i)=>`<article class="task"><div class="task-index">${String(i+1).padStart(2,'0')}</div><div><strong>${o.game} · ${o.customer}</strong><p>${o.mode} · ${oid(o)} · ${o.duration} 分钟</p><p class="hint">${o.status==='DRAFT'?'草稿待发布，尚未开放报名':o.status==='DISPATCHING'?`已确认 ${selected(o).length}/${needed(o)}，还缺 ${shortage(o)} 人`:'服务已结束，等待核对费用'}</p></div><div class="task-time"><b>${o.time}</b><button class="btn small" data-action="open" data-order="${o.n}">${o.status==='DRAFT'?'去发布':o.status==='DISPATCHING'?'去选人':'去核算'} ${icons.arrow}</button></div></article>`).join('')||`<div class="empty"><h3>当前没有此类待办</h3><p>切换分类查看其他需要处理的订单。</p></div>`}</section><aside><section class="panel"><div class="section-head"><div><h2>今晚服务</h2><p>预约时间用于排班参考</p></div><span>3 场</span></div><div class="agenda">${orders.filter(o=>['ASSIGNED','IN_PROGRESS','DRAFT'].include function seatsHTML(o){return `<div class="seat-head"><div><h2>队伍席位</h2><p>每个岗位独立计算名额</p></div><span class="mono">${selected(o).length} / ${needed(o)} 已确认</span></div><div class="seats">${o.roles.map(r=>{const members=o.players.filter(p=>p.role===r.name&&(p.status==='SELECTED'||picks.has(p.id))),miss=remaining(o,r,true);return `<section class="seat ${miss?'open':''}"><div class="seat-top"><b>${r.name}</b><span class="mono">${members.length} / ${r.need}</span></div>${members.map(p=>`<div class="person"><span class="avatar">${p.name[0]}</span><div><b>${p.name}</b><small>${p.status==='SELECTED'?'已确认':'本次暂选'}</small></div>${p.status==='SELECTED'?'<span class="seat-ok">已就位</span>':''}</div>`).join('')}${Array.from({length:miss},()=>`<div class="person empty-seat"><span class="avatar">+</span><div><b>等待${r.name}</b><small>从报名人选中选择</small></div></div>`).join('')}</section>`}).join('')}</div>`}

function reviewHTML(o){const confirmed=selected(o),chosen=o.players.filter(p=>picks.has(p.id)),miss=shortage(o,true);return `<aside class="panel review"><div class="review-top"><h2>${o.status==='DISPATCHING'?'确认人选':'订单摘要'}</h2><span>${o.status==='DISPATCHING'?'复核后提交':''}</span></div><div class="review-group"><div class="review-label">已确认 · ${confirmed.length} 人</div>${confirmed.length?confirmed.map(p=>`<div class="review-person"><b>${p.name}</b><span>${p.role}</span></div>`).join(''):'<div class="review-empty">暂无已确认人选</div>'}</div>${o.status==='DISPATCHING'?`<div class="review-group"><div class="review-label">本次暂选 · ${chosen.length} 人</div>${chosen.length?chosen.map(p=>`<div class="review-person"><b>${p.name}</b><span>${p.role}</span></div>`).join(''):'<div class="review-empty">从左侧报名中选择</div>'}</div><div class="shortage">${miss?'确认后仍缺 '+miss+' 人，订单继续报名。':'所有岗位已补齐，确认后进入已选定。'}</div><button class="btn primary" data-action="confirm-picks" ${chosen.length?'':'disabled'}>确认选人${chosen.length?' · '+chosen.length+' 人':''}</button><p class="review-note">支持部分确认；开始计时后才进入服务中。</p>`:`<div class="summary-line"><span>客户</span><b>${o.customer}</b></div><div class="summary-line"><span>计划时长</span><b>${o.duration} 分钟</b></div>`}<div class="tools"><button data-action="copy" data-copy="group">群派单文案 ${icons.copy}</button><button data-action="copy" data-copy="selected" ${confirmed.length?'':'disabled'}>已选人选文案 ${icons.copy}</button><button data-action="copy" data-copy="apply">报名链接 ${icons.copy}</button><button data-action="copy" data-copy="boss">客户选人链接 ${icons.copy}</button></div></aside>`}
function stateHTML(o){const c={DRAFT:['等待发布','确认需求与岗位人数后开放 10 分钟报名。','publish','发布派单'],CONFIRMED:['等待发布','确认需求与岗位人数后开放 10 分钟报名。','publish','发布派单'],ASSIGNED:['队伍已选定','人员已经确认，等待服务开始；预约时间不代表已经开始计时。','copy','查看已选文案'],IN_PROGRESS:['服务进行中','实际时长由服务端记录，完成后进入费用核对。','',''],PENDING_CONFIRMATION:['等待核对费用','服务已结束，请核对实际时长、订单扣费与收入确认。','settlement','查看核算演示'],COMPLETED:['订单已完成','订单核算已经确认；陪玩付款仍由财务结算批次处理。','',''],CANCELLED:['订单已取消','报名和后续操作已经关闭。','','']}[o.status];return `<section class="panel state-card"><h2>${c[0]}</h2><p>${c[1]}</p>${c[2]?`<div class="button-row"><button class="btn primary" data-action="${c[2]}" data-copy="selected">${c[3]}</button></div>`:''}<div class="state-note"><b>服务需求</b><br>${o.game} · ${o.mode} · ${o.roles.map(r=>r.name+' '+r.need+' 人').join(' / ')}</div></section>${!['DRAFT','CONFIRMED','CANCELLED'].includes(o.status)?`<div style="margin-top:20px">${seatsHTML(o)}</div>`:''}`}
function detailHTML(){const o=order(),stage={DRAFT:0,CONFIRMED:0,DISPATCHING:1,ASSIGNED:2,IN_PROGRESS:3,PENDING_CONFIRMATION:4,COMPLETED:5,CANCELLED:-1}[o.status];return `<button class="back" data-action="back">${icons.back} 返回订单与派单</button>${head('ORDER DETAIL',`<span class="mono">${oid(o)}</span>`,`${o.game} · ${o.mode}`,`<div class="button-row">${badge(o)}<button class="btn" data-action="copy" data-copy="group">${icons.copy}群派单文案</button></div>`)}<div class="steps">${['待发布','报名选人','已选定','服务中','待核算','已完成'].map((s,i)=>`<div class="step ${stage===i?'current':stage>i?'done':''}"><strong>0${i+1}</strong>${s}</div>`).join('')}</div><div class="detailgrid"><div><section class="panel facts"><dl class="fact"><dt>客户</dt><dd>${o.customer}</dd></dl><dl class="fact"><dt>计划时长</dt><dd>${o.duration} 分钟</dd></dl><dl class="fact"><dt>${o.time.includes(':')?'预约时间':'服务进度'}</dt><dd class="mono">${o.time}</dd></dl><dl class="fact"><dt>岗位需求</dt><dd>${o.roles.map(r=>r.name+' '+r.need).join(' / ')}</dd></dl></section>${o.status==='DISPATCHING'?seatsHTML(o)+applicantsHTML(o):stateHTML(o)}</div>${reviewHTML(o)}</div>`}
const moduleData={customers:['记录台 · 客户档案','维护客户档案、联系方式、订单记录与余额入口。',['客户列表与检索','客户详情与历史订单','余额及账变入口']],players:['记录台 · 陪玩档案','维护陪玩资料、接单状态、技能标签与结算信息。',['陪玩列表与审核','服务能力与状态','收入及结算记录']],catalog:['记录台 · 服务目录','配置游戏、服务模式、岗位模板与计价规则。',['游戏与服务项目','岗位需求模板','价格与时长规则']],finance:['记录台 · 收入与结算','查看客户账变、陪玩收入与结算批次。',['客户余额与流水','陪玩收入记录','结算批次管理']],sessions:['监控台 · 进行中场次','集中查看正在进行的场次、服务端计时与证据进度。',['在线场次列表','时长与结束提醒','开始/结束证据核对']],disputes:['监控台 · 异常与争议','集中处理退款、证据、申诉与处理记录。',['争议证据','处理时间线','结算冻结状态']],notifications:['监控台 · 通知与任务健康','管理站内通知、业务提醒、失败重试与触达状态。',['通知列表','失败与重试队列','消息模板']],audit:['记录台 · 审计日志','追踪敏感操作、状态变更和操作者。',['操作日志','状态变更记录','筛选与导出']],settings:['门店设置','配置门店资料、员工权限与功能开关。',['门店资料','员工与角色','套餐功能开关']]};function moduleHTML(id){const m=moduleData[id];return head('MODULE TEMPLATE',m[0],m[1],`<button class="btn">页面权限说明</button>`)+`<div class="module-shell"><section class="panel module-intro"><h2>${m[0]}的页面框架</h2><p>该模块已纳入统一导航与页面模板。当前原型重点打磨工作台、派单列表和订单详情，后续可在同一套标题、筛选、表格、详情侧栏与反馈组件上继续展开。</p><div class="module-list">${m[2].map((x,i)=>`<div class="module-row"><b>0${i+1} · ${x}</b><span>使用统一列表 / 详情模板</span></div>`).join('')}</div></section><aside class="template-note"><h3>模板约束</h3><p>后续接入功能时保持这些界面原则：</p><ul><li>一页只有一个主要动作</li><li>状态文字与动作一一对应</li><li>列表负责判断，详情负责完成</li><li>金额与状态以服务端结果为准</li><li>租户权限由服务端执行</li></ul></aside></div>`}
function modal(title,body,actions='<button class="btn" data-action="close">关闭</button>'){modalAction=null;$('#dialog-body').innerHTML=`<h2>${title}</h2>${body}<div class="modal-actions">${actions}</div>`;$('#dialog').showModal()}
function confirmModal(title,body,label,fn){modal(title,body,`<button class="btn" data-action="close">取消</button><button class="btn primary" data-action="modal-confirm">${label}</button>`);modalAction=fn}
function notify(t){const x=$('#toast');x.textContent=t;x.hidden=false;clearTimeout(notify.t);notify.t=setTimeout(()=>x.hidden=true,2400)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.action;if(b.dataset.nav){view=b.dataset.nav;picks.clear();$('#app').classList.remove('menu-open');render();return}if(a==='menu'){$('#app').classList.toggle('menu-open');return}if(a==='work-filter'){filter=b.dataset.status;view='dispatch';render();return}if(a==='task-filter'){workFilter=b.dataset.status;render();return}if(a==='filter'){filter=b.dataset.status;render();return}if(a==='open'){current=b.dataset.order;view='detail';picks.clear();render();return}if(a==='back'){view='dispatch';picks.clear();render();return}if(a==='clear'){filter='ALL';query='';render();return}if(a==='refresh'){notify('数据已刷新 · 原型演示');return}if(a==='new-order'){modal('新建派单模板','<p>新建流程将沿用同一视觉系统：选择客户与游戏模板 → 确认岗位与时长 → 创建草稿 → 在详情发布。</p><div class="notice">本轮只固定 UI 模板，不连接创建接口。</div>');return}if(a==='notes'){modal('v3 设计说明','<p><b>结构来自 v1：</b>明确的待办工作台、完整业务表格、详情两栏与完整模块导航。</p><p><b>精细度来自 v2：</b>轻边框、紧凑字体、独立岗位席位、状态与主动作联动。</p><p><b>项目约束：</b>后续生产实现使用 Next.js、Tailwind v4、shadcn 风格组件与 TanStack Query。本文件是隔离原型，示例数据和操作只在内存中。</p><div class="notice">报名截止不等于开始服务；部分选人后可继续报名；核算确认不等于已向陪玩付款。</div>',`<button class="btn" data-action="reset">重置演示数据</button><button class="btn primary" data-action="close">了解</button>`);return}if(a==='close'){$('#dialog').close();return}if(a==='modal-confirm'){const fn=modalAction;$('#dialog').close();if(fn)fn();return}if(a==='remove'){const o=order(),p=o.players.find(x=>x.id===b.dataset.player);confirmModal('移除这条报名？',`<p>将从 ${oid(o)} 的${p.role}报名中移除 <b>${p.name}</b>。已确认人选不受影响。</p>`,'移除报名',()=>{o.players=o.players.filter(x=>x.id!==p.id);picks.delete(p.id);render();notify('已移除 '+p.name+' · 仅原型演示')});return}if(a==='confirm-picks'){const o=order(),chosen=o.players.filter(p=>picks.has(p.id)),miss=shortage(o,true);if(!chosen.length)return;confirmModal('复核本次人选',`<p>以下 ${chosen.length} 位将确认为 ${oid(o)} 的服务人选。</p>${chosen.map(p=>`<div class="summary-line"><b>${p.name}</b><span>${p.role}</span></div>`).join('')}<div class="notice">${miss?'确认后仍缺 '+miss+' 人，订单保持报名选人。':'岗位全部补齐，订单将进入已选定。'}</div>`,'确认选人',()=>{chosen.forEach(p=>p.status='SELECTED');picks.clear();if(!shortage(o))o.status='ASSIGNED';render();notify(o.status==='ASSIGNED'?'人选已确认 · 队伍已选定':'人选已确认 · 剩余岗位继续报名')});return}if(a==='publish'){const o=order();confirmModal('发布派单',`<p>${oid(o)} · ${o.game} · ${o.mode}</p><div class="summary-line"><span>岗位需求</span><b>${o.roles.map(r=>r.name+' '+r.need+' 人').join('、')}</b></div><div class="notice">发布后将开放 10 分钟报名。</div>`,'发布派单',()=>{o.status='DISPATCHING';render();notify('派单已发布 · 原型状态已更新')});return}if(a==='copy'){const o=order(),type=b.dataset.copy,text=type==='group'?`${oid(o)} ${o.game} ${o.mode}，需要${o.roles.map(r=>r.name+r.need+'人').join('、')}`:type==='selected'?`已确认：${selected(o).map(p=>p.name+'（'+p.role+'）').join('、')||'暂无'}`:type==='apply'?'https://example.invalid/apply/'+o.n:'https://example.invalid/boss/'+o.n;modal('复制内容',`<p>原型不写入剪贴板，请选中文字复制。</p><textarea readonly>${text}</textarea>`);return}if(a==='settlement'){modal('核算预览',`<span class="status dispatch">建议能力 · 演示</span><p style="margin-top:12px">以下金额只用于展示核算界面，不是服务端结果。</p><div class="summary-line"><span>实际时长（示例）</span><b>120 分钟</b></div><div class="summary-line"><span>订单扣费（示例）</span><b>¥120.00</b></div><div class="summary-line"><span>扣费后余额（示例）</span><b>¥380.00</b></div><div class="notice">订单扣费与收入确认不代表已向陪玩付款。</div>`,`<button class="btn" data-action="close">关闭</button><button class="btn primary" data-action="settle-demo">模拟确认</button>`);return}if(a==='settle-demo'){order().status='COMPLETED';$('#dialog').close();render();notify('已模拟确认核算 · 未实际扣费');return}if(a==='reset'){orders=structuredClone(initial);picks.clear();view='work';filter='ALL';workFilter='ALL';query='';$('#dialog').close();render();notify('已恢复原型数据')}});
document.addEventListener('change',e=>{if(!e.target.matches('[data-pick]'))return;const id=e.target.dataset.pick;e.target.checked?picks.add(id):picks.delete(id);render()});document.addEventListener('input',e=>{if(e.target.id==='order-search'){query=e.target.value;const pos=e.target.selectionStart;render();const n=$('#order-search');n.focus();n.setSelectionRange(pos,pos)}});$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog'))$('#dialog').close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#app').classList.remove('menu-open')});render();
</script>
</body>
