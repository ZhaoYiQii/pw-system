name: pw-saas-prod

# 生产拓扑：Postgres/Redis 与应用同机（托管 PostgreSQL 就绪后再切换 DATABASE_URL）。
# 所有应用端口只绑定 127.0.0.1，对外 HTTPS 由系统 Caddy 反代。
# 用法：
#   cd <repo>/infra/docker
#   docker compose --env-file /srv/pw-saas/.env build
#   docker compose --env-file /srv/pw-saas/.env run --rm pw-init <cmd>
#   docker compose --env-file /srv/pw-saas/.env up -d

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
      # 首部署引导/授权 SQL（P2 冒烟验证；owner 连进容器即可直接 -f 执行）
      - ./bootstrap-owner.sql:/opt/pw-saas/bootstrap-owner.sql:ro
      - ./grant-runtime.sql:/opt/pw-saas/grant-runtime.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [pw]

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [pw]

  api:
    image: pwsaas/api:prod
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://pw_runtime:${PW_RUNTIME_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      PLATFORM_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      DATABASE_MIGRATION_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379/0
      SESSION_SECRET: ${SESSION_SECRET}
      PII_MASTER_KEY: ${PII_MASTER_KEY}
      ADMIN_WEB_ORIGIN: ${ADMIN_WEB_ORIGIN}
      H5_ORIGIN: ${H5_ORIGIN}
      EVIDENCE_ROOT: /app/data/evidence
      # P3 / D4：报名窗口长度（api 发布/释放名额时创建轮次使用）
      DISPATCH_ROUND_WINDOW_MS: ${DISPATCH_ROUND_WINDOW_MS:-600000}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      ALLOW_MOCK_PAYMENT: ${ALLOW_MOCK_PAYMENT:-false}
      # P2 冒烟发现：api 启动会过 SMS Provider 守卫；NODE_ENV=production 下缺这两项会直接抛
      # "mock sms is not allowed in production" 进入崩溃循环（admin/h5 因依赖不健康一并起不来）。
      # 默认 fail-closed；演示部署在 .env 里显式 ALLOW_MOCK_SMS=true（与 mock 支付同口径）。
      SMS_PROVIDER: ${SMS_PROVIDER:-mock}
      ALLOW_MOCK_SMS: ${ALLOW_MOCK_SMS:-false}
      # S2 真实短信：SMS_PROVIDER=tencent 时下面六项缺一不可（缺项 api 启动即失败并点名变量）；
      # SMS_PROVIDER=mock 时留空无害。worker 不装配短信通道，故只在 api 与 pw-init 侧传。
      TENCENT_SMS_SECRET_ID: ${TENCENT_SMS_SECRET_ID:-}
      TENCENT_SMS_SECRET_KEY: ${TENCENT_SMS_SECRET_KEY:-}
      TENCENT_SMS_SDK_APP_ID: ${TENCENT_SMS_SDK_APP_ID:-}
      TENCENT_SMS_SIGN_NAME: ${TENCENT_SMS_SIGN_NAME:-}
      TENCENT_SMS_TEMPLATE_ID: ${TENCENT_SMS_TEMPLATE_ID:-}
      TENCENT_SMS_REGION: ${TENCENT_SMS_REGION:-ap-guangzhou}
      # S3 微信登录（公众号网页授权）：默认关闭；置 true 时下面三项缺一不可
      WECHAT_LOGIN_ENABLED: ${WECHAT_LOGIN_ENABLED:-false}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      WECHAT_OAUTH_REDIRECT_URI: ${WECHAT_OAUTH_REDIRECT_URI:-}
    volumes:
      - evidence:/app/data/evidence
    ports:
      - "127.0.0.1:4100:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [pw]

  worker:
    image: pwsaas/api:prod
    restart: unless-stopped
    command: ["node", "apps/api/dist/background/bootstrap.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://pw_runtime:${PW_RUNTIME_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      PLATFORM_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      DATABASE_MIGRATION_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379/0
      SESSION_SECRET: ${SESSION_SECRET}
      PII_MASTER_KEY: ${PII_MASTER_KEY}
      OUTBOX_POLL_MS: "5000"
      ORDER_CONFIRM_TIMEOUT_MS: "900000"
      # P3 / D4：报名窗口与关单窗口同一配置源（默认 10 分钟）；关单窗口缺省跟随，0 关闭。
      DISPATCH_ROUND_WINDOW_MS: ${DISPATCH_ROUND_WINDOW_MS:-600000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [pw]

  admin:
    image: pwsaas/admin:prod
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.admin
      args:
        NEXT_PUBLIC_API_ORIGIN: ${NEXT_PUBLIC_API_ORIGIN}
        NEXT_PUBLIC_TENANT_HOST_SUFFIX: ${NEXT_PUBLIC_TENANT_HOST_SUFFIX:-17ai.club}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "127.0.0.1:4200:3000"
    depends_on:
      api:
        condition: service_healthy
    networks: [pw]

  h5:
    image: pwsaas/h5:prod
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.h5
    restart: unless-stopped
    ports:
      - "127.0.0.1:4300:80"
    depends_on:
      api:
        condition: service_healthy
    networks: [pw]

  pw-init:
    image: pwsaas/api:prod
    profiles: ["init"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://pw_runtime:${PW_RUNTIME_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      PLATFORM_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      DATABASE_MIGRATION_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379/0
      SESSION_SECRET: ${SESSION_SECRET}
      PII_MASTER_KEY: ${PII_MASTER_KEY}
      ADMIN_WEB_ORIGIN: ${ADMIN_WEB_ORIGIN}
      H5_ORIGIN: ${H5_ORIGIN}
      EVIDENCE_ROOT: /app/data/evidence
      SEED_TENANT_CODE: ${SEED_TENANT_CODE}
      SEED_TENANT_NAME: ${SEED_TENANT_NAME}
      SEED_TENANT_HOSTS: ${SEED_TENANT_HOSTS}
      SEED_PLATFORM_PASSWORD: ${SEED_PLATFORM_PASSWORD}
      SEED_TENANT_PASSWORD: ${SEED_TENANT_PASSWORD}
      # 种子脚本会走身份模块，与 api 同口径带上 SMS 开关
      SMS_PROVIDER: ${SMS_PROVIDER:-mock}
      ALLOW_MOCK_SMS: ${ALLOW_MOCK_SMS:-false}
      # 与 api 同口径：SMS_PROVIDER=tencent 时缺任一项这里也会启动失败
      TENCENT_SMS_SECRET_ID: ${TENCENT_SMS_SECRET_ID:-}
      TENCENT_SMS_SECRET_KEY: ${TENCENT_SMS_SECRET_KEY:-}
      TENCENT_SMS_SDK_APP_ID: ${TENCENT_SMS_SDK_APP_ID:-}
      TENCENT_SMS_SIGN_NAME: ${TENCENT_SMS_SIGN_NAME:-}
      TENCENT_SMS_TEMPLATE_ID: ${TENCENT_SMS_TEMPLATE_ID:-}
      TENCENT_SMS_REGION: ${TENCENT_SMS_REGION:-ap-guangzhou}
      WECHAT_LOGIN_ENABLED: ${WECHAT_LOGIN_ENABLED:-false}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      WECHAT_OAUTH_REDIRECT_URI: ${WECHAT_OAUTH_REDIRECT_URI:-}
      DISPATCH_ROUND_WINDOW_MS: ${DISPATCH_ROUND_WINDOW_MS:-600000}
    volumes:
      - evidence:/app/data/evidence
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [pw]

volumes:
  pgdata: {}
  redisdata: {}
  evidence: {}

networks:
  pw:
    driver: bridge
